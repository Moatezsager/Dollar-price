<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <title>مؤشر الدينار | Dinar Index</title>
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="description" content="متابعة أسعار العملات والذهب في ليبيا لحظة بلحظة من السوق الموازي والمصرف المركزي" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مؤشر الدينار" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="مؤشر الدينار" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Icons & Splash Screens -->
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/app-icon.png" />
    
    <style>
      /* Safe area padding for notched phones */
      :root {
        --safe-area-inset-top: env(safe-area-inset-top);
        --safe-area-inset-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <style>
        body {
          margin: 0;
          background-color: #000000;
        }
        .splash-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background-color: #000000;
          color: white;
          font-family: system-ui, -apple-system, sans-serif;
        }
        .splash-logo-container {
          position: relative;
          width: 160px;
          height: 160px;
          margin-bottom: 24px;
          display: flex;
          justify-content: center;
          align-items: center;
        }
        .splash-logo-glow {
          position: absolute;
          inset: 10px;
          background-color: rgba(16, 185, 129, 0.15);
          border-radius: 50%;
          filter: blur(30px);
          animation: pulse-glow 3s ease-in-out infinite;
        }
        .splash-logo {
          position: relative;
          width: 100%;
          height: 100%;
          object-fit: contain;
          z-index: 10;
        }
        .splash-title {
          font-size: 28px;
          line-height: 36px;
          font-weight: 800;
          letter-spacing: 0.02em;
          background: linear-gradient(to right, #34d399, #10b981);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin: 0;
        }
        .splash-subtitle {
          font-size: 14px;
          color: #a1a1aa;
          margin-top: 10px;
          font-weight: 500;
          letter-spacing: 0.05em;
        }
        .splash-loader {
          margin-top: 50px;
          width: 80px;
          height: 3px;
          background-color: rgba(255, 255, 255, 0.08);
          border-radius: 4px;
          overflow: hidden;
          position: relative;
        }
        .splash-loader::after {
          content: '';
          position: absolute;
          left: -50%;
          height: 100%;
          width: 50%;
          background-image: linear-gradient(90deg, transparent, #10b981, transparent);
          border-radius: 4px;
          animation: loading 1.8s infinite ease-in-out;
        }
        @keyframes pulse-glow {
          0%, 100% { opacity: 0.4; transform: scale(0.9); }
          50% { opacity: 0.8; transform: scale(1.1); }
        }
        @keyframes loading {
          0% { left: -50%; }
          100% { left: 100%; }
        }
      </style>
      <div class="splash-container">
        <div class="splash-logo-container">
          <div class="splash-logo-glow"></div>
          <img src="/app-icon.png" alt="Logo" class="splash-logo" />
        </div>
        <h1 class="splash-title">مؤشر الدينار</h1>
        <p class="splash-subtitle">جاري التحميل...</p>
        <div class="splash-loader"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
